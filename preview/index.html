<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>中醫方證資料庫</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="方證資料庫">
<meta name="theme-color" content="#edf1ee">
<style>
:root{--bg:#edf1ee;--ink:#17242a;--muted:#566769;--line:#c9d4cf;--accent:#2d6cb0;--surface:#f8faf8;--bad:#a8322b}
@media (prefers-color-scheme:dark){:root{--bg:#11191c;--ink:#e2e9e6;--muted:#94a5a4;--line:#32434a;--accent:#8fbbe3;--surface:#19242a;--bad:#f0938a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:22rem}
h1{font-family:"Songti TC","Noto Serif TC",serif;font-size:1.5rem;letter-spacing:.06em;margin:0 0 4px}
#msg{color:var(--muted);margin:0 0 20px;min-height:1.7em}
#msg.bad{color:var(--bad)}
label{display:block;font-size:.875rem;color:var(--muted);margin-bottom:4px}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
button{width:100%;font:inherit;font-weight:700;color:var(--bg);background:var(--accent);border:0;border-radius:3px;padding:11px 12px;margin-top:12px;cursor:pointer}
button:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.8125rem;margin:20px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>中醫方證資料庫</h1>
  <p id="msg" role="status">載入中…</p>
  <form id="f" hidden>
    <label for="pw">密碼</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">解鎖</button>
  </form>
  <p class="hint" id="hint" hidden>第一次開啟需要網路和密碼。解鎖一次之後，這台裝置會記住，沒有網路也能開。</p>
</main>
<script>
(() => {   // 包起來，解鎖後換上 App 的內容時名稱才不會互相衝突
const KEY = 'tcm-app-key-v1', ITER = 600000;
const $ = id => document.getElementById(id);
const say = (t, bad) => { $('msg').textContent = t; $('msg').className = bad ? 'bad' : ''; };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let blob = null;

async function derive(pw, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER }, k, 512));
}
/* 檔案格式：'TCM1' + salt(16) + iv(16) + AES-256-CBC 密文 + HMAC-SHA256(32) */
async function unlock(keys, remember) {
  const body = blob.slice(0, blob.length - 32), tag = blob.slice(blob.length - 32);
  const mk = await crypto.subtle.importKey('raw', keys.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  if (!await crypto.subtle.verify('HMAC', mk, tag, body)) return false;
  const ek = await crypto.subtle.importKey('raw', keys.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: body.slice(20, 36) }, ek, body.slice(36)));
  if (remember) { try { localStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, keys))); } catch (e) {} }
  if (lobbyOpen) { pendingHtml = html; dataFrame(html); return true; }   // 還在大廳：按「進入資料庫」時再換上；先在背景載好給病證報告單用
  showApp(html);
  return true;
}

/* ---- 大廳（經絡銅人）：一開啟先進大廳，按「進入資料庫」才到資料庫 ---- */
let lobbyOpen = false, pendingHtml = null, lobbyEl = null, appShown = false, pendingGo = null, pendingBz = false;
function openLobby() {
  if (!lobbyEl || !document.body.contains(lobbyEl)) {
    lobbyEl = document.createElement('div');
    lobbyEl.style.cssText = 'position:fixed;inset:0;z-index:2147483646;background:#050403';
    const f = document.createElement('iframe');
    f.src = 'lobby/?t=' + Date.now();   // 每次都拿最新的大廳頁（有些 App 內建瀏覽器不走 service worker，會用 10 分鐘內的舊檔）
    f.title = '經絡銅人大廳';
    f.style.cssText = 'border:0;width:100%;height:100%;display:block';
    lobbyEl.appendChild(f);
    document.body.appendChild(lobbyEl);
  }
  lobbyEl.style.display = '';
  document.documentElement.style.overflow = 'hidden';
  lobbyOpen = true;
}
function closeLobby() {
  lobbyOpen = false;
  if (lobbyEl) lobbyEl.style.display = 'none';
  document.documentElement.style.overflow = '';
  if (pendingHtml) { const h = pendingHtml; pendingHtml = null; showApp(h); }
  else if (appShown) goApp();
  else if (!blob || !document.getElementById('f') || document.getElementById('f').hidden === false) { const pw = document.getElementById('pw'); if (pw) pw.focus(); }
}
// 大廳傳來 go：進入資料庫後直接打開那一個條目（例如病證區域點的病名）
function onMsg(e) {
  if (e.data && e.data.type === 'tcm-lobby-loaded') { loadData(); return; }
  if (!e.data || e.data.type !== 'tcm-enter') return;
  loadData();
  pendingGo = typeof e.data.go === 'string' ? e.data.go : null;
  pendingBz = !!e.data.bz;   // 大廳點病名：打開八綱辨證，而不是表格
  closeLobby();
}
function goApp() {
  const id = pendingGo, bz = pendingBz; pendingGo = null; pendingBz = false;
  if (!id || !document.body) return;
  if (bz && window.TCMBZ && window.TCMBZ.open(id)) return;
  const a = document.createElement('a');   // 交給資料庫自己的 data-go 點擊處理
  a.href = '#' + id; a.dataset.go = id; a.hidden = true;
  document.body.appendChild(a); a.click(); a.remove();
}
// 大廳裡的病證報告單要用資料庫的下拉選單：在看不見的 iframe 先把資料庫跑起來（同網域），大廳直接借它的八綱辨證
function withBz(html, base) {
  const i = html.lastIndexOf('</body>');
  if (i > 0) html = html.slice(0, i) + '<link rel="stylesheet" href="bz/bz.css"><script src="bz/bz.js"><\/script>' + html.slice(i);
  if (base) { const h = html.search(/<head[^>]*>/i); html = h >= 0 ? html.replace(/<head[^>]*>/i, m => m + '<base href="' + base + '">') : '<base href="' + base + '">' + html; }
  return html;
}
function dataFrame(html) {
  if (document.getElementById('tcm-data')) return;
  const f = document.createElement('iframe');
  f.id = 'tcm-data'; f.title = '資料庫（背景）'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
  f.style.cssText = 'position:fixed;left:-9999px;top:0;width:1024px;height:768px;border:0;visibility:hidden;pointer-events:none';
  f.src = URL.createObjectURL(new Blob([withBz(html, location.href.replace(/[#?].*$/, ''))], { type: 'text/html' }));
  f.addEventListener('load', () => {
    const t0 = Date.now();
    (function ready() {
      let ok = false; try { ok = !!(f.contentWindow.TCMBZ && f.contentWindow.TCMBZ.mount); } catch (e) {}
      if (ok) { const lf = lobbyEl && lobbyEl.querySelector('iframe'); if (lf && lf.contentWindow) lf.contentWindow.postMessage({ type: 'tcm-data-ready' }, '*'); return; }
      if (Date.now() - t0 < 15000) setTimeout(ready, 200);
    })();
  });
  document.body.appendChild(f);
}
function showApp(html) {
  // 預覽：解鎖後加上八綱辨證（程式在 bz/，不含資料，資料取自解鎖後的資料庫）
  html = withBz(html);
  document.open(); document.write(html); document.close();
  lobbyEl = null; appShown = true;
  if (pendingGo) { const t0 = Date.now(); (function wait() { if (document.readyState === 'complete' || Date.now() - t0 > 5000) setTimeout(goApp, 120); else setTimeout(wait, 50); })(); }
  window.addEventListener('message', onMsg);   // 換頁後重新掛上
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = '銅人';
  b.title = '回到大廳';
  b.setAttribute('aria-label', '回到大廳（經絡銅人）');
  b.style.cssText = 'position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top,0px));z-index:2147483645;width:44px;height:44px;border-radius:50%;border:1px solid rgba(214,166,107,.55);background:rgba(28,20,12,.82);color:#ffe3b8;font:500 12px/1 "Noto Serif TC","Songti TC",serif;letter-spacing:.05em;box-shadow:0 2px 12px rgba(0,0,0,.3);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)';
  b.addEventListener('click', openLobby);
  const add = () => document.body && document.body.appendChild(b);
  if (document.body) add(); else document.addEventListener('DOMContentLoaded', add);
}
window.addEventListener('message', onMsg);
openLobby();
// 先讓大廳的人體模型下載（不跟 13 MB 的資料庫搶網路）；模型載完、按進入資料庫、或 20 秒後才抓資料庫
let dataStarted = false;
setTimeout(loadData, 20000);
async function loadData() {
  if (dataStarted) return;
  dataStarted = true;
  try {
    const r = await fetch('data.enc', { cache: 'no-cache' });   // 每次都問伺服器有沒有更新，沒變就不重抓
    if (!r.ok) throw new Error('HTTP ' + r.status);
    blob = new Uint8Array(await r.arrayBuffer());
    if (String.fromCharCode.apply(null, blob.slice(0, 4)) !== 'TCM1') throw new Error('檔案格式不對');
  } catch (e) {
    say(navigator.onLine === false ? '現在沒有網路，而這台裝置還沒有開啟過。請先連上網路開一次。' : '載入失敗：' + e.message, true);
    return;
  }
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { if (await unlock(Uint8Array.from(atob(saved), c => c.charCodeAt(0)), false)) return; } catch (e) {}
    try { localStorage.removeItem(KEY); } catch (e) {}
  }
  say('請輸入密碼。'); $('f').hidden = false; $('hint').hidden = false; $('pw').focus();
}
$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('go').disabled = true; say('解鎖中…');
  try {
    if (await unlock(await derive($('pw').value, blob.slice(4, 20)), true)) return;
    say('密碼不對，請再試一次。', true);
  } catch (err) { say('解鎖失敗：' + err.message, true); }
  $('go').disabled = false; $('pw').select();
});
})();
</script>
</body>
</html>
